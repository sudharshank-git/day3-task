<body>
    <!-- header of the Login Form -->
    <header>
        <section class="navbar">
            <h1>Portfolio</h1>
            <nav class="nav-container">
                <div class="toggle">
                        <input type="checkbox" id="togglebutton" class="checkbox">
                        <label for="togglebutton" class="btn"></label>
                </div>
                <a href="./index.html" class="login nav-opn login">Login</a>
                <a href="./feedback.html" class="feedback nav-opn feedback" >Feedback</a>
            </nav>
        </section>
    </header>
    <!-- Login from And description from -->
    <main>
        <section class="login-form">
            <aside class="from-field">
                <form action="./feedback.html">
                <h1>Login<span class="alt">/SignUp</span></h1>
                <fieldset class="fieldset-form">
                    <legend>Login-Form</legend>
                    <lable for="email">Email:</lable>
                    <input type="email" id="email" placeholder="Enter your Email" required/>
                    <lable for="password">Password:</lable>
                    <input type="password" id="password" placeholder="**********" required/>
                    <button type="submit">Login</button>
                </fieldset>
            </form>
            </aside>
        </section>
    </main>
    <!-- Footer of the Login Form -->
    <footer>
        <section class="footer-bar">
            <nav class="foot-nav"><h1>Contact Us</h1>
            
                <small>@2026 All Rights Reserved</small>
